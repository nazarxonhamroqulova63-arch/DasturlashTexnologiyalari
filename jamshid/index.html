<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Training</title>
</head>
<body>
    <form action="">
        <input type="text" id="numberInput">
        <button type="button" id="checkNumberBtn" onclick="checkNumber()">Check Number</button>
        <p id="numberResult"></p>
        <p id="mathResult"></p>
        <input type="text" id="dividendInput">
        <input type="text" id="divisorInput">
        <button type="button" id="divideBtn" onclick="runDivision()">Divide</button>
        <p id="divisionResult"></p>
        <input type="text" id="arrayInput">
        <button type="button" id="analyzeArrayBtn" onclick="analyzeArray()">Analyze Array</button>
        <p id="arrayResult"></p>
        <button type="button" id="generateRandomBtn" onclick="generateRandom()">Generate Random</button>
        <p id="randomResult"></p>
        <button type="button" id="clearBtn" onclick="clearResults()">Clear Results</button>
        <p id="errorResult"></p>
    </form>
    <script src="script.js"></script>
</body>
</html>
